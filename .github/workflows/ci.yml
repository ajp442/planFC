# Tests every pull request and push to main against the built image, and
# publishes to ghcr.io/ajp442/planfc only when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0) and those same tests pass.
# Pushes to main publish nothing, so `latest` only ever moves on a deliberate
# release. Each release also gets a GitHub release listing the third-party
# versions inside the image (tools/version_matrix.py).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Once per published architecture, each on a native runner: arm64 under
  # QEMU would run the browser tests many times slower.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # compose.yaml runs ghcr.io/ajp442/planfc:${PLANFC_VERSION}, so tagging
      # the local build :ci makes the deployer's compose file run it unchanged.
      PLANFC_VERSION: ci
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_PASSWORD: ci-only-not-a-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # The runner's own architecture, loaded into its Docker rather than
      # pushed. One cache scope per architecture, since two jobs writing the
      # same scope would each overwrite the other's index; publish reads both.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/ajp442/planfc:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # -f compose.yaml alone: the dev override would build from source and
      # bind-mount the tree, and the point is to test the image as shipped.
      - name: Django tests inside the image
        run: docker compose -f compose.yaml run --rm web python manage.py test --noinput

      - name: Start the stack
        run: |
          docker compose -f compose.yaml up -d
          timeout 90 sh -c 'until curl -fsS http://localhost:8080/healthz; do sleep 2; done'

      - name: Browser tests (Android Chrome and iOS Safari engines)
        run: ./e2e/run.sh

      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml logs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.arch }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner build the arm64 image too (Raspberry Pi,
      # ARM cloud hosts).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 is tagged 1.2.3, 1.2 and latest. The image name is written out
      # because GHCR requires lowercase and the repository is "planFC".
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ajp442/planfc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The layers the test jobs built and tested, so QEMU has little or
          # nothing left to run for arm64.
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

  # Publishes a GitHub release per version tag carrying what its image
  # contains: versions.json for this tag, and VERSIONS.md, the matrix across
  # every release so far. Newest is always at
  # https://github.com/ajp442/planFC/releases/latest/download/VERSIONS.md
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # Full history for the tag list: earlier tags are gathered below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The matrix is read by running the pushed image, arm64 included.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record this release's versions
        run: |
          mkdir matrix
          python3 tools/version_matrix.py collect "$TAG" "ghcr.io/ajp442/planfc:${TAG#v}" \
            --platform linux/amd64 --platform linux/arm64 --compose compose.yaml \
            > "matrix/$TAG.json"

      # Each earlier release already carries its record. A tag from before
      # this job existed has none, so its image is read instead; one whose
      # tests failed was never pushed and is left out.
      - name: Gather earlier releases
        run: |
          for tag in $(git tag -l 'v*.*.*'); do
            [ "$tag" = "$TAG" ] && continue
            gh release download "$tag" -p versions.json -O "matrix/$tag.json" 2>/dev/null && continue
            python3 tools/version_matrix.py collect "$tag" "ghcr.io/ajp442/planfc:${tag#v}" \
              --platform linux/amd64 --platform linux/arm64 > "matrix/$tag.json" \
              || { echo "::notice::$tag has no published image; left out of the matrix"; rm -f "matrix/$tag.json"; }
          done

      - name: Publish the release
        run: |
          cp "matrix/$TAG.json" versions.json
          python3 tools/version_matrix.py render "matrix/$TAG.json" > notes.md
          python3 tools/version_matrix.py render matrix/*.json > VERSIONS.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          # A re-run finds the release already there and refreshes it.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" versions.json VERSIONS.md --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md versions.json VERSIONS.md
          fi
