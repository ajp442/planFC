# Publishes the web image to ghcr.io/ajp442/planfc when a version tag is
# pushed (git tag v0.1.0 && git push origin v0.1.0). Pushes to main publish
# nothing, so `latest` only ever moves on a deliberate release.
name: Publish image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner build the arm64 image too (Raspberry Pi,
      # ARM cloud hosts).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 is tagged 1.2.3, 1.2 and latest. The image name is written out
      # because GHCR requires lowercase and the repository is "planFC".
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ajp442/planfc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
