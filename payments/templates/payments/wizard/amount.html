{% extends "payments/wizard/_base.html" %}
{% block step %}
<form method="post" class="card stack" id="wizard_form">
  {% csrf_token %}
  <input type="hidden" name="goto" value="">
  <h1>{{ draft.payer_name }}</h1>
  {{ form.non_field_errors }}
  <p>
    <label for="{{ form.amount.id_for_label }}">{{ form.amount.label }}</label>
    {{ form.amount }}
    {{ form.amount.errors }}
  </p>
  <button type="submit">Next</button>
</form>
{% endblock %}
